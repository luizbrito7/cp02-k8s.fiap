apiVersion: v1
kind: Pod
metadata:
  name: store-api-full
  namespace: store-dev
  labels:
    app: store-api-full
    tier: backend
    env: dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  initContainers:
    - name: preparar-logs
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "$(date) [preparar-logs] arquivo de log criado" > /var/log/app/access.log
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
    - name: log-shipper
      image: busybox:1.36
      restartPolicy: Always
      command: ["tail", "-F", "/var/log/app/access.log"]
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
  containers:
    - name: store-api
      image: store-api:1.0
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args:
        - uvicorn main:app --host 0.0.0.0 --port 8000 2>&1 | tee -a /var/log/app/access.log
      ports:
        - name: http
          containerPort: 8000
      readinessProbe:
        httpGet:
          path: /ready
          port: http
        initialDelaySeconds: 3
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
  volumes:
    - name: logs
      emptyDir: {}
