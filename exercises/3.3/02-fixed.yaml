apiVersion: v1
kind: Pod
metadata:
  name: store-api
  namespace: store-dev
  labels:
    app: store-api
    tier: backend
    env: dev
spec:
  containers:
    - name: store-api
      image: store-api:1.0
      ports:
        - name: http
          containerPort: 8000
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: store-api
  namespace: store-dev
spec:
  type: ClusterIP
  selector:
    app: store-api
    env: dev
  ports:
    - port: 80
      targetPort: 8000
